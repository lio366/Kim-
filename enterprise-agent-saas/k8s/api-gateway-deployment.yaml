apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-api
  template:
    metadata:
      labels:
        app: enterprise-api
    spec:
      containers:
        - name: api
          image: enterprise-agent-saas:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100"]
          ports:
            - containerPort: 8100
